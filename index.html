<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零用錢管理系統</title>
  <style>
    *{box-sizing:border-box}
    html{min-height:100%;background:#050b2b}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#eef4ff;background:
      radial-gradient(circle at 20% 15%,rgba(94,123,255,.28) 0 1px,transparent 2px),
      radial-gradient(circle at 72% 24%,rgba(255,255,255,.85) 0 1px,transparent 2px),
      radial-gradient(circle at 35% 65%,rgba(255,255,255,.75) 0 1px,transparent 2px),
      radial-gradient(circle at 88% 72%,rgba(139,186,255,.8) 0 1px,transparent 2px),
      radial-gradient(circle at 10% 88%,rgba(255,255,255,.7) 0 1px,transparent 2px),
      linear-gradient(180deg,#020624 0%,#07134a 48%,#101d5a 100%);
      background-size:170px 170px,230px 230px,310px 310px,270px 270px,190px 190px,100% 100%;
      background-attachment:fixed;position:relative;overflow-x:hidden}
    body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
    body::before{background:
      radial-gradient(circle at 15% 35%,rgba(91,83,255,.22),transparent 25%),
      radial-gradient(circle at 85% 55%,rgba(51,154,255,.18),transparent 28%),
      radial-gradient(circle at 50% 100%,rgba(164,93,255,.18),transparent 32%)}
    body::after{background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px);background-size:97px 113px;opacity:.38}
    .container{position:relative;z-index:1;max-width:1000px;margin:auto;padding:28px 18px 50px}
    h1{text-align:center;margin:0 0 24px;font-size:clamp(28px,5vw,42px);text-shadow:0 0 18px rgba(139,180,255,.8)}
    h1::first-letter{filter:drop-shadow(0 0 8px #ffd966)}
    h2{color:#fff;text-shadow:0 0 10px rgba(130,170,255,.45)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{background:linear-gradient(145deg,rgba(20,43,105,.78),rgba(8,22,67,.82));border:1px solid rgba(125,174,255,.45);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(10px)}
    .full{grid-column:1/-1}
    label{display:block;font-weight:700;margin:12px 0 6px;color:#dbe7ff}
    input,select,button{width:100%;padding:11px 12px;border:1px solid rgba(142,180,255,.42);border-radius:10px;font:inherit}
    input,select{background:rgba(4,15,50,.72);color:#f4f7ff;outline:none}
    input::placeholder{color:#91a5cf}
    input:focus,select:focus{border-color:#8db5ff;box-shadow:0 0 0 3px rgba(98,139,255,.18)}
    button{border:0;cursor:pointer;font-weight:700;background:linear-gradient(135deg,#735cff,#4b8dff);color:#fff;margin-top:14px;box-shadow:0 5px 15px rgba(73,105,255,.28);transition:.2s}
    button:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .balance{font-size:36px;font-weight:800;margin:8px 0;color:#8fffe0;text-shadow:0 0 15px rgba(92,255,212,.35)}
    .income{color:#65f0b1}.expense{color:#ff8eaf}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
    .stat{background:rgba(255,255,255,.06);border:1px solid rgba(145,180,255,.18);border-radius:12px;padding:12px;text-align:center;color:#cbd8f5}
    .stat strong{display:block;font-size:20px;margin-top:4px;color:#fff}
    .goal-row{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;color:#e9f0ff}
    .progress{height:22px;background:rgba(255,255,255,.12);border:1px solid rgba(142,180,255,.28);border-radius:999px;overflow:hidden}
    .progress-bar{height:100%;width:0;background:linear-gradient(90deg,#795cff,#64c8ff);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;transition:width .3s;box-shadow:0 0 14px rgba(99,154,255,.55)}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:600px;background:rgba(2,12,42,.28);border-radius:12px;overflow:hidden}
    th,td{padding:11px 8px;border-bottom:1px solid rgba(153,183,240,.13);text-align:left}
    th{background:rgba(74,111,191,.28);color:#eaf1ff}
    td{color:#d7e2f8}
    .delete{width:auto;padding:6px 10px;margin:0;background:linear-gradient(135deg,#ff5f7d,#e74768);box-shadow:none}
    .empty{text-align:center;color:#9aabd0;padding:24px}
    .card::before{content:"✦";float:right;color:rgba(255,231,139,.55);font-size:18px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr}.container{padding-top:20px}}
  </style>
</head>
<body>
<main class="container">
<h1>💰 零用錢管理系統</h1>
<div class="grid">
<section class="card"><h2>新增紀錄</h2><form id="recordForm"><label>日期</label><input id="date" type="date" required><label>類型</label><select id="type"><option value="income">收入</option><option value="expense">支出</option></select><label>項目</label><input id="item" type="text" placeholder="例如：零用錢、買文具" required><label>金額</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="例如：100" required><button type="submit">＋ 新增紀錄</button></form></section>
<section class="card"><h2>目前餘額</h2><div id="balance" class="balance">$0</div><div class="stats"><div class="stat">總收入<strong id="incomeTotal" class="income">$0</strong></div><div class="stat">總支出<strong id="expenseTotal" class="expense">$0</strong></div><div class="stat">紀錄筆數<strong id="recordCount">0</strong></div></div></section>
<section class="card full"><h2>🎯 儲蓄目標</h2><label>想買什麼？</label><input id="goalName" type="text" placeholder="例如：500元玩具"><label>目標金額</label><input id="goalAmount" type="number" min="0" step="0.01" placeholder="500"><button id="saveGoal" type="button">儲存目標</button><div style="margin-top:20px"><div class="goal-row"><strong id="goalLabel">尚未設定目標</strong><span id="goalPercent">0%</span></div><div class="progress"><div id="progressBar" class="progress-bar">0%</div></div><p id="goalStatus">請設定你的儲蓄目標。</p></div></section>
<section class="card full"><h2>📋 收支紀錄</h2><div class="table-wrap"><table><thead><tr><th>日期</th><th>類型</th><th>項目</th><th>金額</th><th>操作</th></tr></thead><tbody id="recordList"></tbody></table></div></section>
</div></main>
<script>
const RECORD_KEY='moneyRecords',GOAL_KEY='savingGoal';let records=JSON.parse(localStorage.getItem(RECORD_KEY)||'[]'),goal=JSON.parse(localStorage.getItem(GOAL_KEY)||'null');const $=id=>document.getElementById(id);const money=n=>'$'+Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});const escapeHtml=s=>String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));$('date').value=new Date().toISOString().slice(0,10);
function render(){let income=records.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0),expense=records.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0),balance=income-expense;$('balance').textContent=money(balance);$('incomeTotal').textContent=money(income);$('expenseTotal').textContent=money(expense);$('recordCount').textContent=records.length;const list=$('recordList');list.innerHTML=records.length?records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${escapeHtml(r.date)}</td><td class="${r.type}">${r.type==='income'?'收入':'支出'}</td><td>${escapeHtml(r.item)}</td><td class="${r.type}">${r.type==='income'?'+':'-'}${money(r.amount)}</td><td><button class="delete" onclick="deleteRecord('${r.id}')">刪除</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">目前還沒有收支紀錄</td></tr>';if(goal){$('goalName').value=goal.name||'';$('goalAmount').value=goal.amount||'';$('goalLabel').textContent=goal.name||'儲蓄目標';const target=Number(goal.amount)||0,percent=target>0?Math.max(0,Math.min(100,balance/target*100)):0;$('goalPercent').textContent=percent.toFixed(0)+'%';$('progressBar').style.width=percent+'%';$('progressBar').textContent=percent.toFixed(0)+'%';$('goalStatus').textContent=target>0?`目前 ${money(balance)} / 目標 ${money(target)}${balance>=target?' 🎉 目標達成！':''}`:'請輸入有效的目標金額。'}else{$('goalLabel').textContent='尚未設定目標';$('goalPercent').textContent='0%';$('progressBar').style.width='0%';$('progressBar').textContent='0%';$('goalStatus').textContent='請設定你的儲蓄目標。'}}
$('recordForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return;records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:$('date').value,type:$('type').value,item:$('item').value.trim(),amount});localStorage.setItem(RECORD_KEY,JSON.stringify(records));e.target.reset();$('date').value=new Date().toISOString().slice(0,10);render()});$('saveGoal').addEventListener('click',()=>{const name=$('goalName').value.trim(),amount=Number($('goalAmount').value);if(!name||!Number.isFinite(amount)||amount<=0){alert('請輸入目標名稱與有效的目標金額。');return}goal={name,amount};localStorage.setItem(GOAL_KEY,JSON.stringify(goal));render()});function deleteRecord(id){records=records.filter(r=>r.id!==id);localStorage.setItem(RECORD_KEY,JSON.stringify(records));render()}window.deleteRecord=deleteRecord;render();
</script>
</body></html>
